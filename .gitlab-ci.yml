### Intel compilers + MPI + MKL ###
build.intel:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/aims-gitlab-runner-ubuntu22-intel2023-openmpi4.1.5-gnu11:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - ulimit -s unlimited
    - cd external/SCOTCH/src/libscotch
    - bison -p scotchyy -y -b y -d -v -o ./tmp2.c ./parser_yy.y
    - cd ../../../../
    - cat ./toolchains/intel.cmake
    - rm -rf $CI_JOB_NAME
    - mkdir $CI_JOB_NAME
    - cd $CI_JOB_NAME
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/intel.cmake ..
    - make -j4
  artifacts:
    paths:
      - $CI_JOB_NAME/
    when: always
    expire_in: 1 days

### Intel compilers + MPI + MKL (shared library) ###
build.intel-shared:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/aims-gitlab-runner-ubuntu22-intel2023-openmpi4.1.5-gnu11:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - ulimit -s unlimited
    - cd external/SCOTCH/src/libscotch
    - bison -p scotchyy -y -b y -d -v -o ./tmp2.c ./parser_yy.y
    - cd ../../../../
    - cat ./toolchains/intel.cmake
    - rm -rf $CI_JOB_NAME
    - mkdir $CI_JOB_NAME
    - cd $CI_JOB_NAME
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/intel.cmake -DBUILD_SHARED_LIBS=ON ..
    - make -j4
  artifacts:
    paths:
      - $CI_JOB_NAME/
    when: always
    expire_in: 1 days

