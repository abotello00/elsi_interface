before_script:
  # - module use /home/wy29/opt/modulefiles
  # - module use /home/yy244/yy_modules
  # - module purge
  # - module load gcc-7.5.0
  # - module load cmake_3.20.5
  - export OMP_NUM_THREADS=1
  - ulimit -c 0
  - ulimit -a

variables:
  CI_DEBUG_TRACE: "true"

stages:
  - build

### GNU compilers + MPICH + Netlib BLAS, LAPACK, ScaLAPACK ###
build.gnu:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/aims-gitlab-runner-ubuntu22-intel2023-mpich4.1.2-gnu11:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - export PATH=$MPICH_HOME/bin/:$PATH
    - export LD_LIBRARY_PATH=$MPICH_HOME/lib:$LD_LIBRARY_PATH
    - cat ./toolchains/gnu.cmake
    - rm -rf build
    - mkdir build
    - cd build
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/gnu.cmake ..
    - make -j4
    - ctest --output-on-failure
  artifacts:
    when: always
    expire_in: 1 days

### NVIDIA HPC SDK (20.7) ###
build.nvhpc:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: yaoyi1992/aims-gitlab-runner-nvhpc-centos:0.4
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - cat ./toolchains/nvhpc.cmake
    - export LD_PRELOAD=/usr/lib64/libstdc++.so.6
    - rm -rf build
    - mkdir build
    - cd build
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/nvhpc.cmake ..
    - make -j4
    - ctest --output-on-failure
  artifacts:
    when: always
    expire_in: 1 days

### Intel compilers + MPI + MKL ###
build.intel:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/aims-gitlab-runner-ubuntu22-intel2023-mpich4.1.2-gnu11:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - export MKL_DYNAMIC=FALSE
    - export MKL_NUM_THREADS=1
    - cat ./toolchains/intel.cmake
    - rm -rf build
    - mkdir build
    - cd build
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/intel.cmake ..
    - make -j4
    - ctest --output-on-failure
  artifacts:
    when: always
    expire_in: 1 days

### Intel compilers + MPI + MKL (shared library) ###
build.intel-shared:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/aims-gitlab-runner-ubuntu22-intel2023-mpich4.1.2-gnu11:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - export MKL_DYNAMIC=FALSE
    - export MKL_NUM_THREADS=1
    - cat ./toolchains/intel.cmake
    - rm -rf build
    - mkdir build
    - cd build
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/intel.cmake -DBUILD_SHARED_LIBS=ON ..
    - make -j4
    - ctest --output-on-failure
  artifacts:
    when: always
    expire_in: 1 days

