### Intel compilers + MPI + MKL ###
test.intel:
  stage: test
  dependencies:
    - build.intel
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/aims-gitlab-runner-ubuntu22-intel2023-openmpi4.1.5-gnu11:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - ulimit -s unlimited
    - cd build.intel
    - ctest --output-on-failure
  artifacts:
    when: always
    expire_in: 1 days

