before_script:
  - export OMP_NUM_THREADS=1
  - ulimit -c 0
  - ulimit -a

variables:
  CI_DEBUG_TRACE: "true"

stages:
  - build
  - test

##### BUILD STAGE #####

### GNU compilers + MPICH + Netlib BLAS, LAPACK, ScaLAPACK ###
build.gnu:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/ubuntu20-intel2022-mpich3.3.2-gnu10.5:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
  script:
    - export PATH=$MPICH_HOME/bin/:$PATH
    - export LD_LIBRARY_PATH=$MPICH_HOME/lib:$LD_LIBRARY_PATH
    - cd external/SCOTCH/src/libscotch
    - bison -p scotchyy -y -b y -d -v -o ./tmp2.c ./parser_yy.y
    - cd ../../../../
    - cat ./toolchains/gnu.cmake
    - rm -rf $CI_JOB_NAME
    - mkdir $CI_JOB_NAME
    - cd $CI_JOB_NAME
    - cmake -DCMAKE_TOOLCHAIN_FILE=../toolchains/gnu.cmake ..
    - make -j4
  artifacts:
    when: always
    paths:
      - $CI_JOB_NAME/
    expire_in: 1 days

### LATEST GNU compilers + MPICH + Netlib BLAS, LAPACK, ScaLAPACK ###
build.gnu-latest:
  stage: build
  rules:
    - when: on_success
  tags:
    - docker
  image:
    name: uthpalaherath/ubuntu22-intel2024-mpich4.2.0-gnu13.2:latest
    entrypoint: [ '/bin/bash', '-c', 'ln -snf /bin/bash /bin/sh && /bin/bash -c $0' ]
